<text x="426" y="209" font-family="DejaVu Sans,Arial" font-weight="700" font-size="24" fill="#233e75">Project ZIP</text>
<text x="426" y="249" font-family="DejaVu Sans,Arial" font-size="16" fill="#29466f">Python model modules</text>
<text x="426" y="278" font-family="DejaVu Sans,Arial" font-size="16" fill="#29466f">Streamlit app + tests</text>
<text x="426" y="307" font-family="DejaVu Sans,Arial" font-size="16" fill="#29466f">Agent-neutral brief</text>
