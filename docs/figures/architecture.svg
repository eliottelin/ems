<text x="77" y="249" font-family="DejaVu Sans,Arial" font-size="16" fill="#294a40">Select data + models</text>
<text x="77" y="278" font-family="DejaVu Sans,Arial" font-size="16" fill="#294a40">Define customization</text>
<text x="77" y="307" font-family="DejaVu Sans,Arial" font-size="16" fill="#294a40">Runs locally or hosted</text>
