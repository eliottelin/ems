<text x="773" y="249" font-family="DejaVu Sans,Arial" font-size="16" fill="#6d552d">Run and explore results</text>
<text x="773" y="278" font-family="DejaVu Sans,Arial" font-size="16" fill="#6d552d">Edit independently</text>
<text x="773" y="307" font-family="DejaVu Sans,Arial" font-size="16" fill="#6d552d">No AI dependency</text>
