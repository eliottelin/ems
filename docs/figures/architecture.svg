<text x="1122" y="249" font-family="DejaVu Sans,Arial" font-size="16" fill="#4f4a79">Any coding agent</text>
<text x="1122" y="278" font-family="DejaVu Sans,Arial" font-size="16" fill="#4f4a79">or human developer</text>
<text x="1122" y="307" font-family="DejaVu Sans,Arial" font-size="16" fill="#4f4a79">Optional cloud app</text>
<rect x="54" y="392" width="1290" height="130" rx="13" fill="#ffffff" stroke="#d1dfd9" stroke-width="2"/>
<text x="80" y="431" font-family="DejaVu Sans,Arial" font-size="19" fill="#173d31" font-weight="700">Scientific model library: the reusable foundation</text>
<text x="80" y="468" font-family="DejaVu Sans,Arial" font-size="17" fill="#445d54">Water balance  |  Plant biomass  |  Soil carbon  |  Open-Meteo weather  |  Dataset adapters (future)</text>
<text x="80" y="498" font-family="DejaVu Sans,Arial" font-size="15" fill="#647970">Tests, units, provenance and model cards travel with each generated application.</text>
