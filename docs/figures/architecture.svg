<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580">
<rect width="1400" height="580" fill="#f7faf9"/>
<text x="55" y="60" font-family="DejaVu Sans,Arial" font-size="34" fill="#13382f" font-weight="700">One builder. Independent research applications.</text>
<text x="55" y="91" font-family="DejaVu Sans,Arial" font-size="18" fill="#50685f">The hosted builder generates code and documentation, not agent-driven execution.</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55786d"/></marker></defs>
